<meta charset="utf-8">
<title>All The Math</title>
<style>
/* one operation at a time, left to right, 3b1b-style. Three tabs: ask (what happens to your prompt), forward pass, training step */
:root{--bg:#000;--fg:#ece6e2;--mute:#7a7a7a;--line:#262626;--yellow:#F7D96F;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;--serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--mono);font-size:12px;margin:0;display:flex;flex-direction:column}
.modes{display:flex;gap:6px;padding:12px 16px 0;flex-wrap:wrap}
.modes button{font:inherit;font-size:13px;background:none;border:1px solid #333;color:var(--mute);padding:5px 12px;cursor:pointer}
.modes button.on{color:var(--yellow);border-color:var(--yellow)}
nav{display:flex;flex-wrap:wrap;gap:2px 0;padding:8px 16px 0}
nav button{font:inherit;font-size:11px;background:none;border:0;color:var(--mute);padding:3px 7px;cursor:pointer}
nav button.on{color:var(--yellow)}
nav .sep{color:#333;padding:3px 0}
button:focus-visible,input:focus-visible{outline:1px solid var(--yellow)}
header{padding:12px 24px 0}
header h1{font-family:var(--serif);font-weight:normal;font-size:30px;margin:0}
header .eq{font-family:var(--serif);font-style:italic;font-size:19px;opacity:.85;margin-top:2px}
header .fl{color:var(--mute);font-size:11px;margin-top:4px}
#stage{flex:1 1 auto;min-height:0;padding:0 8px}
#stage svg{width:100%;height:100%;display:block}
.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.bar button,.bar input[type=text]{font:inherit;font-size:12px;background:none;color:var(--fg);border:1px solid #333;padding:5px 11px;cursor:pointer}
.bar input[type=text]{cursor:text;width:220px}
.bar input[type=range]{accent-color:var(--yellow)}
.bar label{color:var(--mute)}
.bar .r{margin-left:auto;color:var(--mute)}
#play{min-width:70px}
</style>

<div class="modes" id="modes"></div>
<nav id="nav"></nav>
<header><h1 id="h1"></h1><div class="eq" id="eq"></div><div class="fl" id="fl"></div></header>
<div id="stage"></div>
<div class="bar">
  <button id="prev" aria-label="previous step">◀</button>
  <button id="play">play</button>
  <button id="next" aria-label="next step">▶</button>
  <input id="scrub" type="range" min="0" max="1" step="0.001" value="0" style="width:150px" aria-label="progress within this step">
  <label for="txt" id="txtlbl">prompt</label><input id="txt" type="text" value="the cat sat on">
  <button id="train">train 10 steps</button>
  <label for="ep">step</label><input id="ep" type="range" min="0" max="0" value="0" style="width:100px"><span id="epn">0</span>
  <span class="r" id="tot"></span>
</div>

<script>
// ================================================================ the model: 1-layer, 1-head GPT-style transformer, d = 2, RMSNorm
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const CORPUS="the cat sat on the mat. the cat ate the rat. the dog sat on the log.";
function mergeWord(w,a,b){const o=[];for(let i=0;i<w.length;i++){if(i<w.length-1&&w[i]===a&&w[i+1]===b){o.push(a+b);i++}else o.push(w[i])}return o}
function trainBPE(text,n){let words=text.split(" ").map(w=>[...w]);const merges=[];for(let m=0;m<n;m++){const cnt={};for(const w of words)for(let i=0;i<w.length-1;i++){const k=w[i]+"\u0001"+w[i+1];cnt[k]=(cnt[k]||0)+1}let best=null,bc=1;for(const k in cnt)if(cnt[k]>bc){bc=cnt[k];best=k}if(!best)break;const [a,b]=best.split("\u0001");merges.push([a,b]);words=words.map(w=>mergeWord(w,a,b))}return merges}
const MERGES=trainBPE(CORPUS,12),CHARS=[...new Set(CORPUS.replace(/ /g,""))],VOCAB=[...CHARS,...MERGES.map(m=>m[0]+m[1])].filter((v,i,a)=>a.indexOf(v)===i),V=VOCAB.length,d=2,dff=4,ETA=0.5;
function bpeStates(text){let words=text.split(" ").filter(Boolean).map(w=>[...w]);const st=[{words:words.map(w=>w.slice()),merge:null}];
  for(const [a,b] of MERGES){const nw=words.map(w=>mergeWord(w,a,b));if(nw.flat().length!==words.flat().length){st.push({words:nw,merge:[a,b]});words=nw}}return st}
function tokenizeText(text){const known=new Set(CHARS),raw=text.toLowerCase();const dropped=[...new Set([...raw].filter(c=>c!==" "&&!known.has(c)))];
  let clean=[...raw].filter(c=>c===" "||known.has(c)).join("").trim();if(!clean)clean="the";const st=bpeStates(clean);return {st,dropped,ids:st[st.length-1].words.flat().map(t=>VOCAB.indexOf(t))}}
const R0=rng(3),g=()=>Math.sqrt(-2*Math.log(1-R0()))*Math.cos(2*Math.PI*R0());
const mat=(r,c,s)=>Array.from({length:r},()=>Array.from({length:c},()=>+(g()*s).toFixed(2)));
let E=mat(V,d,.8),Wq=mat(d,d,.9),Wk=mat(d,d,.9),Wv=mat(d,d,.9),Wo=mat(d,d,.9),W1=mat(d,dff,.9),b1=[0.1,-0.1,0.05,0],W2=mat(dff,d,.6),b2=[0,0];
const PARAMS=()=>({E,Wq,Wk,Wv,Wo,W1,b1,W2,b2}),clone=o=>JSON.parse(JSON.stringify(o));function setParams(p){({E,Wq,Wk,Wv,Wo,W1,b1,W2,b2}=clone(p))}
const SNAP=[clone(PARAMS())],LOSSES=[];
const mm=(A,B)=>A.map(r=>B[0].map((_,j)=>r.reduce((s,a,k)=>s+a*B[k][j],0)));
const add=(A,B)=>A.map((r,i)=>r.map((v,j)=>v+B[i][j])),addb=(A,b)=>A.map(r=>r.map((v,j)=>v+b[j])),T_=A=>A[0].map((_,j)=>A.map(r=>r[j]));
const colsum=A=>A[0].map((_,j)=>A.reduce((s,r)=>s+r[j],0)),scl=(A,c)=>A.map(r=>r.map(v=>v*c));
const smx=r=>{const m=Math.max(...r.filter(isFinite));const e=r.map(v=>isFinite(v)?Math.exp(v-m):0);const s=e.reduce((a,b)=>a+b,0);return e.map(v=>v/s)};
const rmsOf=r=>Math.sqrt(r.reduce((a,b)=>a+b*b,0)/r.length+1e-5),rmsn=r=>{const q=rmsOf(r);return r.map(v=>v/q)};
const P=t=>Array.from({length:t},(_,i)=>[+Math.sin(i).toFixed(2),+Math.cos(i).toFixed(2)]);
function forwardIds(ids){const tokens=ids.map(i=>VOCAB[i]),T=ids.length;
  const Xe=ids.map(id=>E[id].slice()),Pos=P(T),X=add(Xe,Pos),Q=mm(X,Wq),K=mm(X,Wk),Vv=mm(X,Wv);
  const S=scl(mm(Q,T_(K)),1/Math.sqrt(d)),Sm=S.map((r,i)=>r.map((v,j)=>j>i?-Infinity:v)),A=Sm.map(smx);
  const H=mm(A,Vv),O=mm(H,Wo),X1=add(X,O),L1=X1.map(rmsn),F1=addb(mm(L1,W1),b1),F2=F1.map(r=>r.map(v=>Math.max(0,v))),F3=addb(mm(F2,W2),b2),X2=add(L1,F3),L2=X2.map(rmsn);
  const Lg=mm(L2,T_(E)),Pr=Lg.map(smx),tg=ids.slice(1),loss=tg.map((t,i)=>-Math.log(Pr[i][t]));
  return {tokens,T,ids,Xe,Pos,X,Q,K,Vv,S,Sm,A,H,O,X1,L1,F1,F2,F3,X2,L2,Lg,Pr,tg,loss}}
function forward(text){const tk=tokenizeText(text),m=forwardIds(tk.ids);m.st=tk.st;m.dropped=tk.dropped;return m}
const meanLoss=m=>m.loss.length?m.loss.reduce((a,b)=>a+b,0)/m.loss.length:0;

// ---- backprop, written out op by op (each line is the reverse of one forward line)
function backward(M){const T=M.T,n=Math.max(1,T-1);
  const rmsBack=(X,Y,dY)=>X.map((x,i)=>{const r=rmsOf(x),m=dY[i].reduce((a,b,k)=>a+b*Y[i][k],0)/x.length;return dY[i].map((dy,k)=>(dy-Y[i][k]*m)/r)});
  const dLg=M.Pr.map((r,i)=>r.map((p,v)=>i<T-1?(p-(v===M.tg[i]?1:0))/n:0));
  const dL2=mm(dLg,E),dEout=mm(T_(dLg),M.L2);
  const dX2=rmsBack(M.X2,M.L2,dL2),dF3=dX2,dW2=mm(T_(M.F2),dF3),db2=colsum(dF3);
  const dF2=mm(dF3,T_(W2)),dF1=dF2.map((r,i)=>r.map((v,k)=>M.F1[i][k]>0?v:0)),dW1=mm(T_(M.L1),dF1),db1=colsum(dF1);
  const dL1mlp=mm(dF1,T_(W1)),dL1=add(dX2,dL1mlp),dX1=rmsBack(M.X1,M.L1,dL1),dO=dX1,dWo=mm(T_(M.H),dO),dH=mm(dO,T_(Wo));
  const dA=mm(dH,T_(M.Vv)),dV=mm(T_(M.A),dH);
  const dS=M.A.map((r,i)=>{const s=r.reduce((a,p,k)=>a+p*dA[i][k],0);return r.map((p,j)=>p*(dA[i][j]-s))});
  const c=1/Math.sqrt(d),dQ=scl(mm(dS,M.K),c),dK=scl(mm(T_(dS),M.Q),c);
  const dWq=mm(T_(M.X),dQ),dWk=mm(T_(M.X),dK),dWv=mm(T_(M.X),dV);
  const dX=add(add(add(dX1,mm(dQ,T_(Wq))),mm(dK,T_(Wk))),mm(dV,T_(Wv)));
  const dE=dEout.map(r=>r.slice());M.ids.forEach((id,t)=>{dE[id][0]+=dX[t][0];dE[id][1]+=dX[t][1]});
  return {dLg,dL2,dEout,dX2,dF3,dW2,db2,dF2,dF1,dW1,db1,dL1mlp,dL1,dX1,dO,dWo,dH,dA,dV,dS,dQ,dK,dWq,dWk,dWv,dX,dE,grads:{E:dE,Wq:dWq,Wk:dWk,Wv:dWv,Wo:dWo,W1:dW1,b1:db1,W2:dW2,b2:db2}}}
function stepParams(p,gr){const q=clone(p);for(const k in q){const A=q[k],G=gr[k];if(Array.isArray(A[0]))A.forEach((r,i)=>r.forEach((_,j)=>A[i][j]-=ETA*G[i][j]));else A.forEach((_,i)=>A[i]-=ETA*G[i])}return q}

// ---- answering: run the forward pass, take the most likely next token, append, repeat (weights never change)
const NGEN=8;
function generate(ids){const out=[];ids=ids.slice();for(let n=0;n<NGEN;n++){const m=forwardIds(ids),last=m.T-1,p=m.Pr[last];let nx=0;p.forEach((v,j)=>{if(v>p[nx])nx=j});out.push({ids:ids.slice(),p,attn:m.A[last],next:nx,T:m.T});ids.push(nx)}return out}
function fwdFlops(T){return T*d+3*2*T*d*d+2*T*T*d+T*T+3*T*T+2*T*T*d+2*T*d*d+T*d+5*T*d+2*T*d*dff+T*dff+T*dff+2*T*dff*d+T*d+T*d+5*T*d+2*T*d*V+3*T*V}
function cachedFlops(T){return d+3*2*d*d+2*T*d+T+3*T+2*T*d+2*d*d+d+5*d+2*d*dff+2*dff+2*dff*d+2*d+5*d+2*d*V+3*V}

// ================================================================ drawing kit (SVG, 1200 × 560)
const W=1200,Hh=560;
const C={fg:"#ece6e2",mute:"#7a7a7a",dim:"#3a3a3a",grid:"#12303d",yellow:"#F7D96F",blue:"#58C4DD",teal:"#5CD0B3",green:"#83C167",red:"#FC6255",purple:"#B18CDB",orange:"#F0AC5F"};
const TOKC=[C.blue,C.green,C.red,C.purple,C.orange,C.teal,"#E58FB3"];
const MONO='ui-monospace,SF Mono,Menlo,Consolas,monospace',SERIF='Iowan Old Style,Palatino Linotype,Palatino,Georgia,serif';
let S="",DEC=2;const out=s=>{S+=s};
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
const f=v=>!isFinite(v)?"−∞":(Math.abs(v)<0.5*10**-DEC?(0).toFixed(DEC):v.toFixed(DEC)).replace("-","−");
const vec=r=>`(${r.map(f).join(", ")})`;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t,ease=t=>t*t*(3-2*t);
function txt(x,y,s,o={}){out(`<text x="${x}" y="${y}" fill="${o.c||C.fg}" font-size="${o.s||15}" text-anchor="${o.a||"middle"}" font-family="${o.serif?SERIF:MONO}" ${o.it?'font-style="italic"':""} opacity="${o.o??1}">${esc(s)}</text>`)}
function line(x1,y1,x2,y2,c,w=1,o=1,dash){out(`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}" opacity="${o}" ${dash?`stroke-dasharray="${dash}"`:""}/>`)}
function rect(x,y,w,h,c,o={}){out(`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${o.rx??4}" fill="${o.fill||"none"}" stroke="${c}" stroke-width="${o.w||1.5}" opacity="${o.o??1}" ${o.dash?`stroke-dasharray="${o.dash}"`:""}/>`)}
function arrowPath(x1,y1,x2,y2,c,w=2.5,o=1,dash){const a=Math.atan2(y2-y1,x2-x1),L=Math.hypot(x2-x1,y2-y1),h=Math.min(12,L*0.35);if(L<1)return;const bx=x2-h*Math.cos(a)*0.8,by=y2-h*Math.sin(a)*0.8;
  out(`<g opacity="${o}"><line x1="${x1}" y1="${y1}" x2="${bx}" y2="${by}" stroke="${c}" stroke-width="${w}" ${dash?`stroke-dasharray="${dash}"`:""}/><polygon points="${x2},${y2} ${x2-h*Math.cos(a-0.4)},${y2-h*Math.sin(a-0.4)} ${x2-h*Math.cos(a+0.4)},${y2-h*Math.sin(a+0.4)}" fill="${c}"/></g>`)}
function curve(x1,y1,x2,y2,c,o=1){const mx=(x1+x2)/2,my=(y1+y2)/2;out(`<path d="M${x1} ${y1} Q${mx} ${my} ${x2} ${y2}" fill="none" stroke="${c}" stroke-width="1.5" opacity="${o}" stroke-dasharray="5 4"/>`)}
function matrix(x,y,A,o={}){const cw=o.cw||64,rh=o.rh||32,fs=o.fs||15,R=A.length,Cn=A[0].length,w=Cn*cw,h=R*rh;
  const br=(x0,dir)=>out(`<path d="M${x0+dir*9} ${y-5} L${x0} ${y-5} L${x0} ${y+h+5} L${x0+dir*9} ${y+h+5}" fill="none" stroke="${C.fg}" stroke-width="1.6" opacity=".9"/>`);br(x,1);br(x+w,-1);
  if(o.label)txt(x+w/2,y-16,o.label,{serif:1,it:1,s:21});
  const focus=o.row!=null||o.col!=null||o.cell;
  for(let i=0;i<R;i++)for(let j=0;j<Cn;j++){const v=A[i][j],shown=!o.show||o.show(i,j);const on=(o.row===i&&o.col==null)||(o.col===j&&o.row==null)||(o.cell&&o.cell[0]===i&&o.cell[1]===j);
    const cx=x+j*cw+cw/2,cy=y+i*rh+rh*0.66;if(!shown){txt(cx,cy,"·",{c:C.dim,s:fs});continue}
    txt(cx,cy,f(v),{c:on?C.yellow:!isFinite(v)?C.mute:C.fg,s:fs,o:on?1:focus?0.38:0.9})}
  if(o.rl)o.rl.forEach((l,i)=>txt(x-14,y+i*rh+rh*0.66,l,{a:"end",c:o.row===i?C.yellow:C.mute,s:Math.min(13,fs)}));
  if(o.row!=null&&o.col==null)rect(x+3,y+o.row*rh+2,w-6,rh-4,C.yellow);
  if(o.col!=null&&o.row==null)rect(x+o.col*cw+3,y+2,cw-6,h-4,C.yellow);
  if(o.cell)rect(x+o.cell[1]*cw+3,y+o.cell[0]*rh+2,cw-6,rh-4,C.yellow,{w:2.2});
  return {x,y,w,h,cx:j=>x+j*cw+cw/2,cy:i=>y+i*rh+rh/2,bot:y+h}}
function op(x,y,s){txt(x,y,s,{serif:1,s:26,c:C.mute})}
function plane(cx,cy,R,scale){const px=v=>cx+v/scale*R,py=v=>cy-v/scale*R,step=scale>2.4?1:0.5;
  for(let v=-Math.floor(scale/step)*step;v<=scale+1e-9;v+=step){if(Math.abs(v)<1e-9)continue;line(px(v),cy-R,px(v),cy+R,C.grid,1);line(cx-R,py(v),cx+R,py(v),C.grid,1)}
  line(cx-R,cy,cx+R,cy,"#5a6a72",1.2);line(cx,cy-R,cx,cy+R,"#5a6a72",1.2);txt(px(step),cy+16,step,{c:C.mute,s:11});
  return {px,py,arrow(a,b,c,w=3,o=1,dash){arrowPath(px(a[0]),py(a[1]),px(b[0]),py(b[1]),c,w,o,dash)},dot(p,c,r=4,o=1){out(`<circle cx="${px(p[0])}" cy="${py(p[1])}" r="${r}" fill="${c}" opacity="${o}"/>`)},
    label(p,s,c,dx=8,dy=-8,o=1){txt(px(p[0])+dx,py(p[1])+dy,s,{c,s:13,a:"start",o})},seg(a,b,c,w=1.5,o=1,dash){line(px(a[0]),py(a[1]),px(b[0]),py(b[1]),c,w,o,dash)},
    circle(r,c,o=1,dash){out(`<circle cx="${cx}" cy="${cy}" r="${r/scale*R}" fill="none" stroke="${c}" stroke-width="1.2" opacity="${o}" ${dash?`stroke-dasharray="${dash}"`:""}/>`)},
    poly(pts,c,w=1.5,o=1){out(`<path d="${pts.map((p,k)=>(k?"L":"M")+px(p[0]).toFixed(1)+" "+py(p[1]).toFixed(1)).join(" ")}Z" fill="none" stroke="${c}" stroke-width="${w}" opacity="${o}"/>`)}}}
const vm=(...arrs)=>Math.max(0.6,...arrs.flat(2).filter(isFinite).map(Math.abs))*1.15;
function bars(x,y,w,h,vals,labels,o={}){const n=vals.length,bw=Math.min(54,w/n*0.62),gap=w/n,fin=vals.filter(isFinite);
  const top=o.vmax??Math.max(1e-9,...fin.map(Math.abs)),neg=fin.some(v=>v<0)||o.neg,base=neg?y+h/2:y+h,scale=(neg?h/2:h)/top;
  line(x-6,base,x+w+6,base,"#5a6a72",1.2);
  vals.forEach((v,j)=>{const cx=x+gap*j+gap/2,on=o.hl===j,col=on?C.yellow:(o.colors?o.colors[j]:(v<0?C.red:C.blue));
    if(!isFinite(v)){rect(cx-bw/2,base-28,bw,28,C.dim,{dash:"3 3",rx:2});txt(cx,base-34,"−∞",{c:C.mute,s:12})}
    else{const bh=Math.abs(v)*scale;out(`<rect x="${cx-bw/2}" y="${v>=0?base-bh:base}" width="${bw}" height="${Math.max(0.5,bh)}" fill="${col}" opacity="${on?1:0.85}" rx="2"/>`);if(!o.noval)txt(cx,v>=0?base-bh-7:base+bh+16,f(v),{s:12,c:on?C.yellow:C.fg})}
    if(labels)txt(cx,y+h+(neg?20:22),labels[j],{s:o.ls||12,c:on?C.yellow:C.mute})});return {cx:j=>x+gap*j+gap/2,base}}
// the convolution move: a row over a column, the column slides in, products appear, then they sum
function dotStrip(cx,y,a,b,p,o={}){const K=a.length,gap=Math.min(120,860/K),fs=K>6?13:17,x0=cx-(K-1)*gap/2,slide=ease(clamp(p*2.5,0,1)),off=(1-slide)*-220;
  txt(x0-gap*0.55-26,y,o.aName,{a:"end",c:C.yellow,s:13});txt(x0-gap*0.55-26,y+40,o.bName,{a:"end",c:C.teal,s:13,o:slide});
  for(let n=0;n<K;n++){const X=x0+n*gap,q=clamp((p-0.4)*(K+1)/0.42-n,0,1);
    txt(X,y,f(a[n]),{c:o.masked?C.mute:C.yellow,s:fs});txt(X,y+21,"×",{c:C.mute,s:12,o:slide});txt(X+off,y+42,f(b[n]),{c:o.masked?C.mute:C.teal,s:fs,o:slide});
    if(q>0){txt(X,y+92,f(a[n]*b[n]),{s:fs,o:q*(o.masked?.4:1)});if(n>0)txt(X-gap/2,y+92,"+",{c:C.mute,s:14,o:q})}
    if(o.colLabels)txt(X,y+118,o.colLabels[n],{c:C.mute,s:11,o:slide})}
  line(x0-gap*0.45,y+60,x0+(K-1)*gap+gap*0.45,y+60,C.dim,1,slide);
  const done=clamp((p-0.86)/0.12,0,1);if(done>0&&o.sumText)txt(cx,y+(o.colLabels?150:136),o.sumText,{serif:1,s:20,o:done,c:o.masked?C.mute:C.fg});return {done,topY:y-24}}

// ================================================================ stage builders
let M,G,GEN,NEWP,NEWLOSS;
const tl=()=>M.tokens.map((t,i)=>`${i}:${t}`);

   bars(60,130,1080,300,cur,VOCAB,{vmax:Math.max(1e-6,...cur.map(Math.abs)),neg:true,noval:true,ls:11,hl:t});
   txt(W/2,520,"this is the entire error signal: push the right answer up, push everything else down in proportion to how much it was believed",{c:C.mute,s:12})}},
 MM({key:"dl2",name:"∂L2",eq:"∂L2 = ∂Lg · E      (back through the unembedding)",A:()=>G.dLg,aName:"∂Lg",B:()=>E,bName:"E",out:()=>G.dL2,rl:true,stripLabels:()=>VOCAB}),
 MAP({key:"dx2",name:"∂X2",eq:"back through the norm:  ∂X2 = (∂L2 − L2 · mean(∂L2 ⊙ L2)) / rms",inp:()=>G.dL2,inName:"∂L2",out:()=>G.dX2,outName:"∂X2",opName:"norm, backward",
   rowText:i=>{const y=M.L2[i],dy=G.dL2[i],m=(dy[0]*y[0]+dy[1]*y[1])/2;return `(${vec(dy)} − ${vec(y)} · ${f(m)}) / ${f(rmsOf(M.X2[i]))}  =  ${vec(G.dX2[i])}`},note:"the part of the gradient along the arrow (its length) is removed, because the norm throws length away"}),
 MM({key:"dw2",name:"∂W2",eq:"∂W2 = F2ᵀ · ∂F3      (∂F3 = ∂X2, the residual passes it straight through)",A:()=>T_(M.F2),aName:"F2ᵀ",B:()=>G.dF3,bName:"∂F3",out:()=>G.dW2,rl:hl4,stripLabels:()=>tl(),note:"one product per token: each token's share of this weight's gradient, added together"}),
 MM({key:"df2",name:"∂F2",eq:"∂F2 = ∂F3 · W2ᵀ",A:()=>G.dF3,aName:"∂F3",B:()=>T_(W2),bName:"W2ᵀ",out:()=>G.dF2,rl:true}),
 {key:"drelu",name:"ReLU, backward",eq:"∂F1 = ∂F2 where F1 > 0, else 0",flops:()=>M.T*dff,frames:()=>M.T,
  draw(k,p){const r=G.dF2[k],s=ease(p),cur=r.map((v,n)=>M.F1[k][n]>0?v:v*(1-s));txt(W/2,82,`token ${k}: ${M.tokens[k]}`,{c:C.yellow,s:14});
   bars(300,120,600,300,cur,hl4,{vmax:Math.max(1e-9,...G.dF2.flat().map(Math.abs)),neg:true,colors:M.F1[k].map(v=>v>0?C.blue:C.red)});
   txt(W/2,505,"a unit that was switched off (red) on the way forward passes no gradient back: it learns nothing from this token",{c:C.mute,s:12})}},
 MM({key:"dw1",name:"∂W1",eq:"∂W1 = L1ᵀ · ∂F1",A:()=>T_(M.L1),aName:"L1ᵀ",B:()=>G.dF1,bName:"∂F1",out:()=>G.dW1,rl:x2l,stripLabels:()=>tl(),note:"again a sum over tokens"}),
 MM({key:"dl1",name:"∂L1",eq:"∂L1 = ∂X2 + ∂F1 · W1ᵀ      (residual path + MLP path)",A:()=>G.dF1,aName:"∂F1",B:()=>T_(W1),bName:"W1ᵀ",out:()=>G.dL1,rl:true,post:"+ ∂X2"}),
 MAP({key:"dx1",name:"∂X1",eq:"back through the first norm",inp:()=>G.dL1,inName:"∂L1",out:()=>G.dX1,outName:"∂X1",opName:"norm, backward",
   rowText:i=>`∂X1[${i}] = ${vec(G.dX1[i])}      (∂O and ∂X both get this: X1 = X + O)`}),
 MM({key:"dwo",name:"∂Wo",eq:"∂Wo = Hᵀ · ∂O",A:()=>T_(M.H),aName:"Hᵀ",B:()=>G.dO,bName:"∂O",out:()=>G.dWo,rl:x2l,stripLabels:()=>tl()}),
 MM({key:"dh",name:"∂H",eq:"∂H = ∂O · Woᵀ",A:()=>G.dO,aName:"∂O",B:()=>T_(Wo),bName:"Woᵀ",out:()=>G.dH,rl:true}),
 MM({key:"dv",name:"∂V",eq:"∂V = Aᵀ · ∂H      (how much each value should change, from everyone who attended to it)",A:()=>T_(M.A),aName:"Aᵀ",B:()=>G.dH,bName:"∂H",out:()=>G.dV,rl:true,stripLabels:()=>tl()}),
 MM({key:"da",name:"∂A",eq:"∂A = ∂H · Vᵀ",A:()=>G.dH,aName:"∂H",B:()=>T_(M.Vv),bName:"Vᵀ",out:()=>G.dA,rl:true}),
 MAP({key:"ds",name:"∂S",eq:"back through softmax:  ∂S[i, j] = A[i, j] · (∂A[i, j] − Σ_k A[i, k] ∂A[i, k])",inp:()=>G.dA,inName:"∂A",out:()=>G.dS,outName:"∂S",opName:"softmax, backward",
   rowText:i=>`row ${i}:  Σ_k A·∂A = ${f(M.A[i].reduce((a,p,k)=>a+p*G.dA[i][k],0))}`,note:"masked pairs had A = 0, so they get no gradient: the future stays invisible on the way back too"}),
 MM({key:"dq",name:"∂Q",eq:"∂Q = ∂S · K / √2",A:()=>G.dS,aName:"∂S",B:()=>M.K,bName:"K",out:()=>G.dQ,rl:true,post:"/ √2"}),
 MM({key:"dk",name:"∂K",eq:"∂K = ∂Sᵀ · Q / √2",A:()=>T_(G.dS),aName:"∂Sᵀ",B:()=>M.Q,bName:"Q",out:()=>G.dK,rl:true,post:"/ √2"}),
 MM({key:"dwq",name:"∂Wq",eq:"∂Wq = Xᵀ · ∂Q",A:()=>T_(M.X),aName:"Xᵀ",B:()=>G.dQ,bName:"∂Q",out:()=>G.dWq,rl:x2l,stripLabels:()=>tl()}),
 MM({key:"dwk",name:"∂Wk",eq:"∂Wk = Xᵀ · ∂K",A:()=>T_(M.X),aName:"Xᵀ",B:()=>G.dK,bName:"∂K",out:()=>G.dWk,rl:x2l,stripLabels:()=>tl()}),
 MM({key:"dwv",name:"∂Wv",eq:"∂Wv = Xᵀ · ∂V",A:()=>T_(M.X),aName:"Xᵀ",B:()=>G.dV,bName:"∂V",out:()=>G.dWv,rl:x2l,stripLabels:()=>tl()}),
 {key:"upd",name:"update",eq:`W ← W − η · ∂W,   η = ${ETA}`,flops:()=>3*Object.values(G.grads).flat(2).length,frames:()=>7,
  draw(k,p){const list=[["Wq",Wq,G.dWq,NEWP.Wq],["Wk",Wk,G.dWk,NEWP.Wk],["Wv",Wv,G.dWv,NEWP.Wv],["Wo",Wo,G.dWo,NEWP.Wo],["W1",W1,G.dW1,NEWP.W1],["W2",W2,G.dW2,NEWP.W2],["E",E,G.dE,NEWP.E]][k];
   const [nm,Wm,dW,Wn]=list,big=Wm.length>8,o={rh:big?20:32,fs:big?12:15,cw:big?72:72};
   let x=60;const a=matrix(x,70,Wm,{label:nm,...o});x+=a.w+70;op(x-35,90,`− ${ETA} ·`);const b=matrix(x,70,dW,{label:`∂${nm}`,...o});x+=b.w+50;op(x-25,90,"=");
   matrix(x,70,Wn,{label:`new ${nm}`,...o,show:()=>p>0.5});
   if(Wm[0].length===2&&Wm.length===2){const pl=plane(940,330,180,vm(Wm,Wn,[[1,1]]));const ell=A2=>{const pts=[];for(let q=0;q<=72;q++){const t=q/72*2*Math.PI,u=[Math.cos(t),Math.sin(t)];pts.push([u[0]*A2[0][0]+u[1]*A2[1][0],u[0]*A2[0][1]+u[1]*A2[1][1]])}return pts};
     pl.circle(1,C.dim);pl.poly(ell(Wm),C.mute,1.5,.8);const s=ease(p),Wi=Wm.map((r,i)=>r.map((v,j)=>lerp(v,Wn[i][j],s)));pl.poly(ell(Wi),C.yellow,2);
     Wm.forEach((r,i)=>{pl.arrow([0,0],r,C.mute,2,.6);pl.arrow([0,0],Wi[i],C.yellow,2.5);pl.label(Wi[i],`row ${i}`,C.yellow)});
     txt(940,540,"where the unit circle lands under W: grey before, yellow after",{c:C.mute,s:11})}
   else if(big){const pl=plane(960,320,190,vm(Wm,Wn));const s=ease(p);M.ids.forEach(id=>{});
     Wm.forEach((r,i)=>{const used=Math.hypot(...dW[i])>1e-9,ni=[lerp(r[0],Wn[i][0],s),lerp(r[1],Wn[i][1],s)];pl.dot(ni,used?C.yellow:C.mute,used?4:3,used?1:.5);if(used){pl.seg(r,ni,C.yellow,1.5);pl.label(ni,VOCAB[i],C.yellow)}});
     txt(960,540,"embedding points: only tokens that appeared (or were predicted) move",{c:C.mute,s:11})}
   else txt(900,330,"4 numbers wide: no faithful picture, just the numbers",{c:C.mute,s:12});
   txt(W/2,548,`loss before this step: ${meanLoss(M).toFixed(4)}      loss after (same text, new weights): ${NEWLOSS.toFixed(4)}`,{c:C.yellow,s:13})}}];

// ================================================================ ask: what happens to your prompt
const ASK=[
 {...tokenizeStage,eq:"your prompt is cut into tokens the model knows"},
 {key:"gen",name:"answer, token by token",eq:"run the forward pass → pick the most likely next token → append it → repeat",flops:()=>GEN.reduce((a,g)=>a+fwdFlops(g.T),0),frames:()=>NGEN,
  draw(k,p){const Gk=GEN[k],toks=Gk.ids.map(i=>VOCAB[i]),nPrompt=GEN[0].ids.length;
   const boxes=[];let x=50;toks.forEach((t,n)=>{const bw=24+11*t.length;boxes.push({x,bw,cx:x+bw/2});x+=bw+8});
   const last=boxes[boxes.length-1];
   // attention of the newest position over everything so far: arcs
   Gk.attn.forEach((w,j)=>{if(w<0.01)return;const bj=boxes[j],h=24+Math.abs(last.cx-bj.cx)*0.25;out(`<path d="M${last.cx} 108 Q${(last.cx+bj.cx)/2} ${108-h} ${bj.cx} 108" fill="none" stroke="${C.yellow}" stroke-width="${0.6+5*w}" opacity="${0.25+0.7*w*ease(clamp(p*3,0,1))}"/>`)});
   boxes.forEach((b,n)=>{const gen=n>=nPrompt;rect(b.x,110,b.bw,38,gen?C.teal:C.fg,{w:n===boxes.length-1?2.2:1.2});txt(b.cx,135,toks[n],{c:gen?C.teal:C.fg,s:16})});
   txt(50,182,"your prompt",{a:"start",c:C.mute,s:11});if(k>0)txt(boxes[nPrompt].x,182,"generated",{a:"start",c:C.teal,s:11});
   txt(W/2,230,`the whole forward pass runs on these ${Gk.T} tokens → probabilities for what comes after "${toks[toks.length-1]}"`,{c:C.mute,s:13});
   const b=bars(60,260,1080,190,Gk.p,VOCAB,{vmax:Math.max(...Gk.p),noval:true,ls:11,hl:Gk.next});
   const fly=ease(clamp((p-0.55)/0.4,0,1));if(fly>0){const nt=VOCAB[Gk.next],bw=24+11*nt.length,fx=lerp(b.cx(Gk.next)-bw/2,x,fly),fy=lerp(470,110,fly);rect(fx,fy,bw,38,C.yellow,{w:2.2});txt(fx+bw/2,fy+25,nt,{c:C.yellow,s:16})}
   txt(W/2,520,`p("${VOCAB[Gk.next]}") = ${f(Gk.p[Gk.next])}  ·  ${fwdFlops(Gk.T)} FLOPs for this token, or ${cachedFlops(Gk.T)} with a KV cache (earlier tokens' keys and values are reused)  ·  weights unchanged`,{c:C.mute,s:12});
   txt(W/2,546,"yellow arcs: how much the newest token attends to each earlier one",{c:C.mute,s:11})}},
 {key:"done",name:"what just happened",eq:"no learning: the same frozen weights, run once per new token",flops:()=>0,frames:()=>1,
  draw(k,p){const g=GEN[NGEN-1],toks=[...g.ids,g.next].map(i=>VOCAB[i]),nP=GEN[0].ids.length;
   txt(W/2,120,toks.slice(0,nP).join(" "),{serif:1,s:26});txt(W/2,170,toks.slice(nP).join(" "),{serif:1,s:26,c:C.teal});
   const lines=[`${NGEN} forward passes, one per generated token, ${GEN.reduce((a,x)=>a+fwdFlops(x.T),0)} FLOPs in total (${GEN.reduce((a,x)=>a+cachedFlops(x.T),0)} with a KV cache).`,
     "Nothing in E, Wq, Wk, Wv, Wo, W1 or W2 changed. Answering is only the forward-pass tab, repeated.",
     "A chat model does the same thing at far larger size, with your message wrapped in a template",
     "(\"User: … Assistant:\") and a special end token that tells it when to stop.",
     "This one learned from a single sentence, so with untrained weights it babbles; press train and ask again."];
   lines.forEach((l,i)=>txt(W/2,260+i*34,l,{c:i<2?C.fg:C.mute,s:14}))}}];

// ================================================================ modes, playback
const MODES={ask:{label:"ask: what happens to your prompt",stages:ASK,txt:"prompt"},fwd:{label:"forward pass",stages:FORWARD,txt:"text"},train:{label:"training step",stages:TRAIN,txt:"text"}};
let mode="ask",si=0,t=0,playing=false,last=0;const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches,$=id=>document.getElementById(id);
const LIST=()=>MODES[mode].stages;
function chrome(){const m=$("modes");m.innerHTML="";for(const k in MODES){const b=document.createElement("button");b.textContent=MODES[k].label;b.className=k===mode?"on":"";b.onclick=()=>{mode=k;si=0;t=0;recompute()};m.appendChild(b)}
  const n=$("nav");n.innerHTML="";LIST().forEach((s,k)=>{if(k)n.insertAdjacentHTML("beforeend",'<span class="sep">→</span>');const b=document.createElement("button");b.textContent=s.name;b.className=k===si?"on":"";b.onclick=()=>{si=k;t=0;draw()};n.appendChild(b)});
  $("txtlbl").textContent=MODES[mode].txt}
function draw(){const st=LIST()[si],F=st.frames();t=clamp(t,0,F);const k=Math.min(Math.floor(t),F-1),p=t-k;DEC=mode==="train"&&si>0&&st.key!=="upd"?3:2;
  S="";st.draw(k,clamp(p,0,1));$("stage").innerHTML=`<svg viewBox="0 0 ${W} ${Hh}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="${esc(st.name)}">${S}</svg>`;
  $("h1").textContent=st.name;$("eq").textContent=st.eq;$("fl").textContent=`${st.flops()} FLOPs in this step · ${F} ${F===1?"computation":"computations"} · ${Math.min(F,Math.floor(t)+(t>=F?0:1))} of ${F}`;
  $("scrub").value=t/F;chrome();
  const tot=mode==="ask"?ASK[1].flops():LIST().reduce((a,s)=>a+s.flops(),0);$("tot").textContent=`${tot} FLOPs in this tab · ${M.T} tokens · 82 parameters`}
function stepNext(){const F=LIST()[si].frames();if(t>=F){if(si<LIST().length-1){si++;t=0}}else t=Math.floor(t)+1;draw()}
function stepPrev(){if(t<=0){if(si>0){si--;t=LIST()[si].frames()}}else t=Math.ceil(t)-1;draw()}
function loop(ts){if(!playing)return;const dt=Math.min(100,ts-(last||ts));last=ts;
  if(reduce){if(ts-(loop.acc||0)>1100){loop.acc=ts;stepNext()}}else{const F=LIST()[si].frames();t+=dt/1300;if(t>=F){t=F;if(si<LIST().length-1){if((loop.hold=(loop.hold||0)+dt)>700){loop.hold=0;si++;t=0}}else{playing=false;$("play").textContent="play"}}}
  draw();if(playing)requestAnimationFrame(loop)}
const stop=()=>{playing=false;$("play").textContent="play"};
$("play").onclick=()=>{playing=!playing;$("play").textContent=playing?"pause":"play";last=0;if(playing)requestAnimationFrame(loop)};
$("next").onclick=()=>{stop();stepNext()};$("prev").onclick=()=>{stop();stepPrev()};
$("scrub").oninput=e=>{stop();t=+e.target.value*LIST()[si].frames();draw()};
function recompute(){const text=$("txt").value||"the",ep=+$("ep").value;setParams(SNAP[ep]);M=forward(text);G=backward(M);
  NEWP=stepParams(PARAMS(),G.grads);setParams(NEWP);NEWLOSS=meanLoss(forward(text));setParams(SNAP[ep]);GEN=generate(M.ids);
  $("epn").textContent=ep+(LOSSES[ep]!==undefined?`  loss ${LOSSES[ep].toFixed(3)}`:"");draw()}
$("txt").oninput=()=>{t=0;recompute()};$("ep").oninput=recompute;
$("train").onclick=()=>{const text=$("txt").value||"the";setParams(SNAP[SNAP.length-1]);
  for(let n=0;n<10;n++){const m=forward(text);LOSSES[SNAP.length-1]=meanLoss(m);setParams(stepParams(PARAMS(),backward(m).grads));SNAP.push(clone(PARAMS()))}
  LOSSES[SNAP.length-1]=meanLoss(forward(text));const r=$("ep");r.max=SNAP.length-1;r.value=SNAP.length-1;recompute()};
addEventListener("keydown",e=>{if(e.target.tagName==="INPUT"&&e.target.type==="text")return;if(e.key==="ArrowRight")$("next").click();if(e.key==="ArrowLeft")$("prev").click();if(e.key===" "){e.preventDefault();$("play").click()}});
recompute();
</script>
