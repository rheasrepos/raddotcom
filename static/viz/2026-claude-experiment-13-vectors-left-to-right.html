<title>Vectors Left To Right</title>
<style>
/* every stage is a panel; every row of every matrix is an ARROW; panels read left to right in the order the forward pass computes them */
:root{--bg:#111;--fg:#f0f0f0;--mute:#8a8a8a;--line:#2e2e2e;--gold:#f2c230;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;--serif:Georgia,"Times New Roman",serif;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--mono);font-size:12px;margin:0;padding-inline:0;padding-block:0 0}
#strip{display:flex;gap:0;overflow-x:auto;align-items:flex-start;padding:18px 16px 10px;scroll-snap-type:x proximity}
.panel{flex:0 0 auto;width:300px;scroll-snap-align:start;border-right:1px dashed var(--line);padding:0 14px}
.panel:last-child{border-right:0}
.panel h2{font-family:var(--serif);font-weight:normal;font-size:17px;margin:0;white-space:nowrap}
.panel .fl{color:var(--mute);font-size:11px;margin:2px 0 8px;white-space:nowrap}
.panel .fl b{color:var(--gold);font-weight:normal}
.panel svg{display:block;width:272px;height:272px;background:#0d0d0d;border:1px solid var(--line)}
.panel text{font-family:var(--mono);font-size:10px;fill:var(--fg)}
.panel .how{font-size:11px;color:var(--mute);margin:8px 0 0;min-height:4.2em;line-height:1.45}
.panel .how b{color:var(--fg);font-weight:normal}
.op{flex:0 0 auto;align-self:center;font-family:var(--serif);font-size:26px;color:var(--mute);padding:0 2px;margin-top:-40px}
.bar{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.bar label{color:var(--mute)}
.bar button,.bar input[type=text]{font-family:var(--mono);font-size:11px;background:transparent;color:var(--fg);border:1px solid var(--line);padding:4px 9px;cursor:pointer}
.bar input[type=text]{cursor:text;width:170px}
.bar button.on{border-color:var(--gold);color:var(--gold)}
.bar .tok{display:flex;gap:4px}
.bar .r{margin-left:auto;color:var(--mute)}
</style>

<div id="strip"></div>
<div class="bar">
  <label for="txt">text</label><input id="txt" type="text" value="the cat sat on">
  <span class="tok" id="toks"></span>
  <button id="train">train 10 epochs</button>
  <label for="ep">epoch</label><input id="ep" type="range" min="0" max="0" value="0" style="width:120px"><span id="epn">0</span>
  <label><input type="checkbox" id="circle" checked> unit circle → ellipse under each W</label>
  <span class="r">arrows are rows · gold = the token being followed · scroll →</span>
</div>

<script>
// ============================================================ the same d=2 model as All The Math
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const CORPUS="the cat sat on the mat. the cat ate the rat. the dog sat on the log.";
function trainBPE(text,n){let words=text.split(" ").map(w=>[...w]);const merges=[];for(let m=0;m<n;m++){const cnt={};for(const w of words)for(let i=0;i<w.length-1;i++){const k=w[i]+"\u0001"+w[i+1];cnt[k]=(cnt[k]||0)+1}let best=null,bc=1;for(const k in cnt)if(cnt[k]>bc){bc=cnt[k];best=k}if(!best)break;const [a,b]=best.split("\u0001");merges.push([a,b]);words=words.map(w=>{const o=[];for(let i=0;i<w.length;i++){if(i<w.length-1&&w[i]===a&&w[i+1]===b){o.push(a+b);i++}else o.push(w[i])}return o})}return merges}
function encode(text,merges){let words=text.split(" ").filter(Boolean).map(w=>[...w]);for(const [a,b] of merges)words=words.map(w=>{const o=[];for(let i=0;i<w.length;i++){if(i<w.length-1&&w[i]===a&&w[i+1]===b){o.push(a+b);i++}else o.push(w[i])}return o});return words.flat()}
const MERGES=trainBPE(CORPUS,12),VOCAB=[...new Set([...new Set(CORPUS.replace(/ /g,""))].concat(MERGES.map(m=>m[0]+m[1])))],V=VOCAB.length,d=2,dff=4;
const R=rng(3),g=()=>Math.sqrt(-2*Math.log(1-R()))*Math.cos(2*Math.PI*R());
const mat=(r,c,s)=>Array.from({length:r},()=>Array.from({length:c},()=>+(g()*s).toFixed(2)));
let E=mat(V,d,.8),Wq=mat(d,d,.9),Wk=mat(d,d,.9),Wv=mat(d,d,.9),Wo=mat(d,d,.9),W1=mat(d,dff,.9),b1=[0.1,-0.1,0.05,0],W2=mat(dff,d,.6),b2=[0,0];
const PARAMS=()=>({E,Wq,Wk,Wv,Wo,W1,b1,W2,b2}),clone=o=>JSON.parse(JSON.stringify(o));function setParams(p){({E,Wq,Wk,Wv,Wo,W1,b1,W2,b2}=clone(p))}
const SNAP=[clone(PARAMS())],LOSS=[];
const mm=(A,B)=>A.map(r=>B[0].map((_,j)=>r.reduce((s,a,k)=>s+a*B[k][j],0)));
const add=(A,B)=>A.map((r,i)=>r.map((v,j)=>v+B[i][j])),addb=(A,b)=>A.map(r=>r.map((v,j)=>v+b[j])),T_=A=>A[0].map((_,j)=>A.map(r=>r[j]));
const smx=r=>{const m=Math.max(...r.filter(isFinite));const e=r.map(v=>isFinite(v)?Math.exp(v-m):0);const s=e.reduce((a,b)=>a+b,0);return e.map(v=>v/s)};
const ln=r=>{const mu=r.reduce((a,b)=>a+b,0)/r.length;const va=r.reduce((a,b)=>a+(b-mu)**2,0)/r.length;return r.map(v=>(v-mu)/Math.sqrt(va+1e-5))};
const P=t=>Array.from({length:t},(_,i)=>[+Math.sin(i).toFixed(2),+Math.cos(i).toFixed(2)]);
// tokens outside the tiny corpus vocab (any letter not in "the cat sat on the mat...") have no embedding row:
// drop them, and fall back to "the" if nothing is left (whitespace-only or all-unknown input used to crash here)
function forward(text){let tokens=encode(text,MERGES).filter(t=>VOCAB.includes(t));if(!tokens.length)tokens=encode("the",MERGES);
  const T=tokens.length,ids=tokens.map(t=>VOCAB.indexOf(t));
  const Xe=ids.map(id=>E[id].slice()),Pos=P(T),X=add(Xe,Pos),Q=mm(X,Wq),K=mm(X,Wk),Vv=mm(X,Wv);
  const S=mm(Q,T_(K)).map(r=>r.map(v=>v/Math.sqrt(d))),Sm=S.map((r,i)=>r.map((v,j)=>j>i?-Infinity:v)),A=Sm.map(smx);
  const H=mm(A,Vv),O=mm(H,Wo),X1=add(X,O),L1=X1.map(ln),F1=addb(mm(L1,W1),b1),F2=F1.map(r=>r.map(v=>Math.max(0,v))),F3=addb(mm(F2,W2),b2),X2=add(L1,F3),L2=X2.map(ln);
  const Lg=mm(L2,T_(E)),Pr=Lg.map(smx),targets=ids.slice(1),loss=targets.map((t,i)=>-Math.log(Pr[i][t]));
  return {tokens,T,ids,Xe,Pos,X,Q,K,Vv,S,Sm,A,H,O,X1,L1,F1,F2,F3,X2,L2,Lg,Pr,loss}}
const meanLoss=t=>{const r=forward(t);return r.loss.reduce((a,b)=>a+b,0)/Math.max(1,r.loss.length)};
function trainEpoch(text,lr=0.15,h=1e-3){const p=PARAMS(),base=meanLoss(text),grad={};for(const k in p){const A=p[k];const w=(get,set)=>{const v=get();set(v+h);const l=meanLoss(text);set(v);return (l-base)/h};grad[k]=Array.isArray(A[0])?A.map((r,i)=>r.map((_,j)=>w(()=>A[i][j],x=>A[i][j]=x))):A.map((_,i)=>w(()=>A[i],x=>A[i]=x))}
  for(const k in p){const A=p[k];if(Array.isArray(A[0]))A.forEach((r,i)=>r.forEach((_,j)=>A[i][j]-=lr*grad[k][i][j]));else A.forEach((_,i)=>A[i]-=lr*grad[k][i])}LOSS.push(base);SNAP.push(clone(PARAMS()))}

// ============================================================ drawing: a panel is a little plane; arrows from the origin
const COL=["#f2c230","#5fd1c0","#f07a6a","#8ab4ff","#c89bff","#9be37a","#ffb070"];
const f=v=>(Math.abs(v)<5e-3?0:v).toFixed(2);
let sel=0, M;
const el=(c,h)=>{const d=document.createElement("div");d.className=c;if(h!==undefined)d.innerHTML=h;return d};
function plane(scale){ // returns {svg, P(x,y)->pixel, add(html)}
  const S=272,c=S/2,px=v=>c+v/scale*(c-18),py=v=>c-v/scale*(c-18);
  let o=`<line x1="0" y1="${c}" x2="${S}" y2="${c}" stroke="#2e2e2e"/><line x1="${c}" y1="0" x2="${c}" y2="${S}" stroke="#2e2e2e"/>`;
  for(const t of [-1,1]){o+=`<line x1="${px(t*scale*0.5)}" y1="${c-3}" x2="${px(t*scale*0.5)}" y2="${c+3}" stroke="#444"/><line x1="${c-3}" y1="${py(t*scale*0.5)}" x2="${c+3}" y2="${py(t*scale*0.5)}" stroke="#444"/>`}
  o+=`<text x="${S-4}" y="${c-4}" text-anchor="end" fill="#666">${f(scale)}</text>`;
  return {px,py,c,S,body:o,
    arrow(from,to,color,w=2,op=1,dash=""){const [x1,y1]=[px(from[0]),py(from[1])],[x2,y2]=[px(to[0]),py(to[1])];const a=Math.atan2(y2-y1,x2-x1),h=7;
      this.body+=`<g opacity="${op}"><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="${w}" ${dash?`stroke-dasharray="${dash}"`:""}/><polygon points="${x2},${y2} ${x2-h*Math.cos(a-0.45)},${y2-h*Math.sin(a-0.45)} ${x2-h*Math.cos(a+0.45)},${y2-h*Math.sin(a+0.45)}" fill="${color}"/></g>`},
    dot(p,color,r=3){this.body+=`<circle cx="${px(p[0])}" cy="${py(p[1])}" r="${r}" fill="${color}"/>`},
    label(p,t,color="#e9ecf1",dx=5,dy=-5){this.body+=`<text x="${px(p[0])+dx}" y="${py(p[1])+dy}" fill="${color}">${t}</text>`},
    path(pts,color,w=1,op=.8,close=false){this.body+=`<path d="${pts.map((p,k)=>(k?"L":"M")+px(p[0]).toFixed(1)+" "+py(p[1]).toFixed(1)).join(" ")}${close?" Z":""}" fill="none" stroke="${color}" stroke-width="${w}" opacity="${op}"/>`},
    svg(){return `<svg viewBox="0 0 ${S} ${S}">${this.body}</svg>`}}}
const vmax=A=>Math.max(0.5,...A.flat().filter(isFinite).map(Math.abs))*1.15;
const panel=(title,formula,pl,how)=>{const p=el("panel");p.innerHTML=`<h2>${title}</h2><div class="fl">${formula}</div>${pl.svg()}<div class="how">${how}</div>`;return p};
const opEl=s=>el("op",s);

// a panel showing every token's row as an arrow; the selected one gold + labelled
function arrowsPanel(title,formula,A,tokens,how,extra){const pl=plane(vmax(A));
  if(extra)extra(pl);
  A.forEach((r,i)=>{const on=i===sel;pl.arrow([0,0],r,on?"#f2c230":COL[i%COL.length],on?2.5:1.6,on?1:.55);if(on)pl.label(r,`${i}:${tokens[i].trim()} (${f(r[0])}, ${f(r[1])})`,"#f2c230")});
  return panel(title,formula,pl,how)}
// a weight panel: the ROWS of W as arrows (they are what the input coordinates scale), plus the unit circle's image
function weightPanel(name,W,how){const Wt=T_(W);const pl=plane(vmax(W)); // rows of W (each is a d-vector in the OUTPUT plane) when d_out=2
  if(document.getElementById("circle").checked&&W[0].length===2){const circ=[],img=[];for(let k=0;k<=72;k++){const a=k/72*2*Math.PI,u=[Math.cos(a),Math.sin(a)];circ.push(u);img.push([u[0]*W[0][0]+u[1]*W[1][0],u[0]*W[0][1]+u[1]*W[1][1]])}
    pl.path(circ,"#444",1,1,true);pl.path(img,"#8ab4ff",1.4,.9,true)}
  if(W.length===2){W.forEach((r,k)=>{pl.arrow([0,0],r,"#8ab4ff",2);pl.label(r,`row ${k} = (${f(r[0])}, ${f(r[1])})`,"#8ab4ff")})}
  else{W.forEach((r,k)=>{pl.arrow([0,0],r,"#8ab4ff",1.6,.8);pl.label(r,`row ${k}`,"#8ab4ff")})}
  return panel(name,`${W.length}×${W[0].length}`,pl,how)}
// the construction: x·W = x₀·(row 0 of W) + x₁·(row 1 of W), drawn tip to tail
function matmulPanel(title,formula,X,W,Out,tokens,how){const x=X[sel];const segs=W.map((r,k)=>[r[0]*x[k],r[1]*x[k]]);const pl=plane(vmax(Out.concat(segs)));let tip=[0,0];
  W.forEach((r,k)=>{const seg=[r[0]*x[k],r[1]*x[k]];const next=[tip[0]+seg[0],tip[1]+seg[1]];pl.arrow(tip,next,"#8ab4ff",1.8,.9,"4 3");pl.label([(tip[0]+next[0])/2,(tip[1]+next[1])/2],`${f(x[k])} × row ${k}`,"#8ab4ff",6,-4);tip=next});
  Out.forEach((r,i)=>{if(i!==sel)pl.arrow([0,0],r,COL[i%COL.length],1.4,.4)});
  pl.arrow([0,0],Out[sel],"#f2c230",2.5);pl.label(Out[sel],`= (${f(Out[sel][0])}, ${f(Out[sel][1])})`,"#f2c230");
  return panel(title,formula,pl,how)}
function addPanel(title,formula,A,B,Out,tokens,how,bname){const pl=plane(vmax(Out));const a=A[sel],b=B[sel];
  pl.arrow([0,0],a,"#8ab4ff",1.8,.9);pl.label(a,"before","#8ab4ff");pl.arrow(a,[a[0]+b[0],a[1]+b[1]],"#9be37a",1.8,.9,"4 3");pl.label([a[0]+b[0]/2,a[1]+b[1]/2],bname,"#9be37a",6,-4);
  Out.forEach((r,i)=>{if(i!==sel)pl.arrow([0,0],r,COL[i%COL.length],1.4,.4)});pl.arrow([0,0],Out[sel],"#f2c230",2.5);pl.label(Out[sel],`= (${f(Out[sel][0])}, ${f(Out[sel][1])})`,"#f2c230");
  return panel(title,formula,pl,how)}
function mapPanel(title,formula,A,Out,tokens,how,extra){const pl=plane(vmax(A.concat(Out)));if(extra)extra(pl);
  A.forEach((r,i)=>{const on=i===sel;pl.arrow([0,0],r,on?"#8ab4ff":COL[i%COL.length],on?1.8:1.2,on?.9:.3);if(on)pl.label(r,"before","#8ab4ff")});
  A.forEach((r,i)=>pl.arrow(r,Out[i],i===sel?"#f2c230":COL[i%COL.length],1.2,i===sel?1:.4,"3 3"));
  Out.forEach((r,i)=>{const on=i===sel;pl.arrow([0,0],r,on?"#f2c230":COL[i%COL.length],on?2.5:1.4,on?1:.5);if(on)pl.label(r,`= (${f(r[0])}, ${f(r[1])})`,"#f2c230")});
  return panel(title,formula,pl,how)}
function attnPanel(title,formula,A,Vv,H,tokens,how){const pl=plane(vmax(Vv.concat(H)));const w=A[sel];
  Vv.forEach((v,j)=>{pl.arrow([0,0],v,COL[j%COL.length],1.4,w[j]>0.01?.9:.2);pl.label(v,`v${j} ×${f(w[j])}`,COL[j%COL.length])});
  let tip=[0,0];Vv.forEach((v,j)=>{if(w[j]<0.005)return;const next=[tip[0]+v[0]*w[j],tip[1]+v[1]*w[j]];pl.arrow(tip,next,"#8ab4ff",1.6,.9,"4 3");tip=next});
  pl.arrow([0,0],H[sel],"#f2c230",2.5);pl.label(H[sel],`= (${f(H[sel][0])}, ${f(H[sel][1])})`,"#f2c230");
  return panel(title,formula,pl,how)}
function scoresPanel(Q,K,S,A,tokens){ // dot products as projections: q_sel against every k_j
  const pl=plane(vmax(Q.concat(K)));const q=Q[sel];
  K.forEach((k,j)=>{const op=j<=sel?1:.25;pl.arrow([0,0],k,COL[j%COL.length],1.6,op);const qk=(q[0]*k[0]+q[1]*k[1])/(k[0]**2+k[1]**2+1e-9);const pr=[k[0]*qk,k[1]*qk];pl.arrow(q,pr,"#666",1,op*.8,"2 3");pl.label(k,`k${j}  s=${f(S[sel][j])}${j>sel?" masked":""}  a=${f(A[sel][j])}`,COL[j%COL.length])});
  pl.arrow([0,0],q,"#f2c230",2.5);pl.label(q,`q${sel}`,"#f2c230");
  return panel("scores → softmax",`S[${sel},j] = q${sel}·k_j / √2 ;  A = softmax over j ≤ ${sel}`,pl,`Each grey dashed line drops q${sel} onto k_j: the dot product is how far along k_j that landing is, times |k_j|. Softmax turns the row of scores into weights that sum to 1 — those weights are what the next panel uses.`)}
function lnExtra(pl){const r=Math.SQRT2;pl.path([[-r/Math.SQRT2*1.5,r/Math.SQRT2*1.5],[r/Math.SQRT2*1.5,-r/Math.SQRT2*1.5]],"#8ab4ff",1,.5);pl.dot([1,-1],"#8ab4ff",3);pl.dot([-1,1],"#8ab4ff",3);pl.label([1,-1],"(1,−1)","#8ab4ff");pl.label([-1,1],"(−1,1)","#8ab4ff")}
function tanhExtra(pl){pl.path([[-1,-1],[1,-1],[1,1],[-1,1]],"#8ab4ff",1,.5,true)}

function render(){
  const text=document.getElementById("txt").value||"the",ep=+document.getElementById("ep").value;setParams(SNAP[ep]);M=forward(text);const tk=M.tokens;if(sel>=M.T)sel=0;
  const curLoss=M.loss.length?M.loss.reduce((a,b)=>a+b,0)/M.loss.length:null;   // loss of THIS snapshot (LOSS[] lags one epoch)
  document.getElementById("epn").textContent=ep+(curLoss!==null?`  loss ${curLoss.toFixed(3)}`:"");
  const dropped=encode(text,MERGES).filter(t=>!VOCAB.includes(t));
  document.getElementById("epn").textContent+=dropped.length?`  · skipped (not in vocab): ${[...new Set(dropped)].join(" ")}`:"";
  document.getElementById("toks").innerHTML=tk.map((t,i)=>`<button class="${i===sel?"on":""}" data-i="${i}">${i}:${t.trim()}</button>`).join("");
  document.querySelectorAll("#toks button").forEach(b=>b.onclick=()=>{sel=+b.dataset.i;render()});
  const s=document.getElementById("strip");s.innerHTML="";
  const tokens=tk, i=sel;
  s.append(
    arrowsPanel("Xe","embedding rows",M.Xe,tokens,`Each token's row of E, drawn as an arrow. Nothing has been computed yet; this is where the token starts.`),
    opEl("+"),
    addPanel("X","Xe + P",M.Xe,M.Pos,M.X,tokens,`Position is a second arrow (sin t, cos t) added tip to tail. The token moves; it does not rotate about anything, it just shifts.`,"P"),
    opEl("×"),
    weightPanel("Wq",Wq,`A matrix is two arrows: its rows. Multiplying x by W means scaling row 0 by x₀, row 1 by x₁, and adding. The blue loop is where the unit circle lands: the ellipse's long axis is the direction W amplifies most.`),
    opEl("="),
    matmulPanel("Q","X · Wq",M.X,Wq,M.Q,tokens,`The dashed blue arrows are x₀·row₀ then x₁·row₁, tip to tail. Their sum is the gold arrow. That is all a matmul is.`),
    opEl("·"),
    matmulPanel("K","X · Wk",M.X,Wk,M.K,tokens,`Same construction with Wk. Keys are what queries get compared against.`),
    opEl("→"),
    scoresPanel(M.Q,M.K,M.S,M.A,tokens),
    opEl("→"),
    attnPanel("H","A · V",M.A,M.Vv,M.H,tokens,`The value arrows v_j, each scaled by its attention weight, added tip to tail. The result always lands inside the shape the v's span.`),
    opEl("×"),
    matmulPanel("O","H · Wo",M.H,Wo,M.O,tokens,`Output projection: the same two-arrow construction again.`),
    opEl("+"),
    addPanel("X1","X + O",M.X,M.O,M.X1,tokens,`Residual: the token keeps its own arrow and adds what attention brought (dashed green).`,"O"),
    opEl("→"),
    mapPanel("L1","layernorm(X1)",M.X1,M.L1,tokens,`With d = 2, every normalized arrow lands on one of two points, (1,−1) or (−1,1): the line x₀ + x₁ = 0 at length √2. The dashed path shows each arrow jumping there. At d = 3 this becomes a circle.`,lnExtra),
    opEl("×"),
    weightPanel("W1",W1,`2 → 4 dims. Its two rows are 4-vectors, so only their first two coordinates are drawn, and no ellipse: there is no faithful 2-D picture of a map into 4-D.`),
    opEl("→"),
    arrowsPanel("F3","relu(L1·W1 + b1)·W2 + b2",M.F3,tokens,`What comes back from the 4-D detour. Between L1 and here the token was four numbers; this is the first moment it is an arrow again.`),
    opEl("+"),
    addPanel("X2","L1 + F3",M.L1,M.F3,M.X2,tokens,`Second residual: the MLP's contribution (dashed green) added to the normalized token.`,"F3"),
    opEl("→"),
    mapPanel("L2","layernorm(X2)",M.X2,M.L2,tokens,`Final normalization: back onto the two points. From here the logits are L2 · Eᵀ, i.e. the dot product of this arrow with every embedding row in the first panel.`,lnExtra)
  );
}
document.getElementById("txt").oninput=()=>{sel=0;render()};document.getElementById("ep").oninput=render;document.getElementById("circle").onchange=render;
document.getElementById("train").onclick=()=>{const t=document.getElementById("txt").value||"the";setParams(SNAP[SNAP.length-1]);for(let k=0;k<10;k++)trainEpoch(t);const r=document.getElementById("ep");r.max=SNAP.length-1;r.value=SNAP.length-1;render()};
render();
</script>
